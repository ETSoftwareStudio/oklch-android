name: PR title

# PRs are often squash-merged, and then release-please only sees the PR title. Check that
# it is a Conventional Commit, so no change silently drops out of the changelog.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit, e.g. \"fix: clamp hue before mixing\"."
            echo "fix: and perf: make a patch release, feat: a minor one, feat!: a major one."
            exit 1
          fi
