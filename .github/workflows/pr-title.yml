name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip release-please's PR
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_NAME" = release-please--branches--main ]; then
            echo "release-please's PR: its title is generated, nothing to check."
            exit 0
          fi
          echo "::error::Only the Release workflow may start this check, on release-please's branch."
          exit 1

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?(!?): .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit, e.g. \"fix: clamp hue before mixing\"."
            echo "fix: and perf: make a patch release, feat: a minor one, feat!: a major one."
            exit 1
          fi
          # A removed or changed line in the API dump breaks apps compiled against the old API.
          if [ -z "${BASH_REMATCH[3]}" ] && git diff "$BASE"...HEAD -- '*.api' | grep -q '^-[^-]'; then
            echo "::error::This PR removes or changes public API (see the .api diff). Mark it breaking: \"feat!: ...\" or \"fix!: ...\"."
            exit 1
          fi
