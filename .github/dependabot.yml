version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # The library's minimum versions: raise them by hand, only when needed.
      - dependency-name: "androidx.compose.ui:*"
      - dependency-name: "androidx.compose.runtime:*"
      - dependency-name: "androidx.annotation:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
